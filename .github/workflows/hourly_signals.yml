name: Hourly Crypto & Gold Signal Bot

on:
  schedule:
   # - cron: "0 * * * *"   # هر ساعت، در دقیقه صفر #(به وقت UTC)
  workflow_dispatch: {}     # امکان اجرای دستی از تب Actions

permissions:
  contents: write   # برای commit کردن signal_history.csv

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run signal bot
        env:
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          MAX_CRYPTO_SYMBOLS: ${{ vars.MAX_CRYPTO_SYMBOLS }}
          MIN_QUOTE_VOLUME_USDT: ${{ vars.MIN_QUOTE_VOLUME_USDT }}
          CRYPTO_TIMEFRAME: ${{ vars.CRYPTO_TIMEFRAME }}
          TOP_SIGNALS_COUNT: ${{ vars.TOP_SIGNALS_COUNT }}
          METAL_TICKERS: ${{ vars.METAL_TICKERS }}
          TIMEZONE: ${{ vars.TIMEZONE }}
        run: python -m src.main

      - name: Commit signal history (if changed)
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add signal_history.csv || true
          git diff --cached --quiet || git commit -m "chore: update signal history [skip ci]"
          git push || true
